# CharacterLife bundle for dsh (DeepSeek Harness).
# Turns a dedicated dsh profile into a chat window for one CharacterLife character:
# the "model" is the local CharacterLife server (npm run st:server), which owns persona,
# memory and relationship. dsh only shows the conversation.
#
# Everything that would send harness text to the character is switched off: agent presets
# with tools and skills, runtime-context snapshots, and model-generated session titles.
# CharacterLife reads the last user message as what the person said, so any extra
# harness message would reach the character as if the person had typed it.
# See docs/DSH.md. Patch configs replace the whole config of an entry (no deep merge).

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      characterlife:
        api: openai-completions
        apiKeyEnv: CHARACTERLIFE_API_TOKEN
        # scripts/dsh-chat.ts overrides this with --patch when CHARACTERLIFE_PORT is not 8787
        baseURL: http://127.0.0.1:8787/v1
        displayName: CharacterLife
        # Large window so dsh never tries to summarize the history through the character
        defaultContextWindow: 1048576
        models:
          - id: characterlife/shen-zhiwei
            name: shen-zhiwei
            contextWindow: 1048576
            input:
              - text

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: characterlife
    model: characterlife/shen-zhiwei

# Session titles are generated by asking the model; the character would receive that request.
- id: session-title-llm
  disabled: true

# Coding presets carry tools, skills and a coding persona. Replace them with one plain preset.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: characterlife
- insert:
    - id: preset-characterlife
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: characterlife
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              complete: true
              includeRuntimeContext: false
