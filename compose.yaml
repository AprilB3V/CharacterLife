# CharacterLife with Docker Compose. See docs/DOCKER.md.
#
#   cp .env.docker.example .env      # then set CHARACTERLIFE_API_TOKEN and a model
#   docker compose up -d             # CharacterLife only (mock model or your endpoint)
#   docker compose --profile ollama up -d   # plus a local Ollama container
services:
  characterlife:
    build: .
    image: characterlife:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CHARACTERLIFE_API_TOKEN: ${CHARACTERLIFE_API_TOKEN:?set CHARACTERLIFE_API_TOKEN in .env (at least 8 characters)}
    ports:
      # Published on this machine only; change to "8787:8787" to expose it on your network.
      - "127.0.0.1:8787:8787"
    volumes:
      - characterlife-data:/data
    extra_hosts:
      # Lets the container reach an Ollama or LM Studio server running on the host (Linux too).
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

volumes:
  characterlife-data:
  ollama-models:
