<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
    html, body { height: 700px; }

    /* sandbox world: slanted sky-glass panel on the right */
    .world {
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 560px;
        clip-path: polygon(110px 0, 100% 0, 100% 100%, 0 100%);
        background-color: var(--cl-sky);
        background-image:
            linear-gradient(rgba(255,255,255,.35) 2px, transparent 2px),
            linear-gradient(90deg, rgba(255,255,255,.35) 2px, transparent 2px);
        background-size: 36px 36px;
    }
    .stripe {
        position: absolute; top: 0; bottom: 0; right: 520px; width: 60px;
        clip-path: polygon(110px 0, 100% 0, calc(100% - 110px) 100%, 0 100%);
    }
    .stripe.y { background: var(--cl-tape); right: 545px; width: 150px; clip-path: polygon(110px 0, 150px 0, 40px 100%, 0 100%); }
    .stripe.o { background: var(--cl-orange); right: 525px; width: 150px; clip-path: polygon(110px 0, 150px 0, 40px 100%, 0 100%); }

    .label { position: absolute; left: 80px; top: 58px; }

    h1 {
        position: absolute; left: 76px; top: 128px;
        font-family: var(--font-display);
        font-size: 132px; line-height: 1;
        letter-spacing: -2px;
        color: var(--cl-ink);
    }
    h1 .life {
        color: var(--cl-orange);
        -webkit-text-stroke: 4px var(--cl-ink);
        paint-order: stroke fill;
    }
    .tagline {
        position: absolute; left: 82px; top: 300px; width: 900px;
        font-size: 40px; font-weight: 700; line-height: 1.3;
    }
    .tagline em { font-style: normal; background: linear-gradient(transparent 58%, var(--cl-tape) 58%); padding: 0 4px; }

    .facts { left: 80px; top: 460px; width: 820px; height: 160px; padding: 34px 34px 0; transform: rotate(-1.2deg); }
    .facts .tape { left: 300px; top: -20px; transform: rotate(-3deg); }
    .facts ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 20px; }
    .facts li { white-space: nowrap; font-size: 24px; font-weight: 700; }
    .facts li::before { content: "✓"; color: var(--cl-ok); font-weight: 900; margin-right: 10px; }


    .doctor { right: 30px; bottom: -6px; width: 470px; }
    .cloud { right: 40px; top: 30px; width: 170px; transform: rotate(8deg); }
</style>
</head>
<body>
    <div class="stripe y"></div>
    <div class="stripe o"></div>
    <div class="world"></div>

    <div class="label"><span class="pill">open-source character kernel · lab log</span></div>

    <h1>Character<span class="life">Life</span></h1>

    <p class="tagline">AI characters that <em>live on their own</em>,<br>remember what happened, and keep <em>receipts</em>.</p>

    <div class="card facts">
        <div class="tape"></div>
        <ul>
            <li>any OpenAI-compatible model</li>
            <li>runs locally with Ollama</li>
            <li>zero runtime dependencies</li>
            <li>try it without an API key</li>
        </ul>
    </div>

    <img class="art doctor" src="art/doctor-point.png" alt="">
    <img class="art cloud" src="art/cloud-sparkle.png" alt="">
</body>
</html>
